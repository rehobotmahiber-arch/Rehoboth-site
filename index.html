<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
    <meta charset="UTF-8">

    <title>ርኆቦት መንፈሳዊ ማህበር - Link in Bio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans Ethiopic', sans-serif;
            background-color: #FFFDF9;
            color: #1F2937;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 88, 12, 0.15);
        }
        .btn-spiritual {
            background: linear-gradient(135deg, #EA580C 0%, #C2410C 100%);
            transition: all 0.3s ease;
        }
        .btn-spiritual:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(234, 88, 12, 0.3);
        }

        /* Modals: one explicit rule, so "hidden" and "flex" never fight each other */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
